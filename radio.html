<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rádio Ao Vivo - Voz da Segurança</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050c18;
            background-image: radial-gradient(circle at 50% -20%, #0a1930 0%, #050c18 70%);
            color: #ffffff;
        }

        .fonte-titulo {
            font-family: 'Bebas Neue', sans-serif;
            letter-spacing: 1px;
        }

        /* Glassmorphism do Player */
        .glass-panel {
            background: rgba(10, 17, 32, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Animação do visualizador de áudio (Barrinhas pulando) */
        .bars-container {
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 24px;
        }

        .bar {
            width: 4px;
            background-color: #3b82f6;
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .playing .bar {
            animation: bounce 1s infinite alternate;
        }

            .playing .bar:nth-child(1) {
                animation-delay: 0.1s;
            }

            .playing .bar:nth-child(2) {
                animation-delay: 0.4s;
            }

            .playing .bar:nth-child(3) {
                animation-delay: 0.2s;
            }

            .playing .bar:nth-child(4) {
                animation-delay: 0.5s;
            }

            .playing .bar:nth-child(5) {
                animation-delay: 0.3s;
            }

        @keyframes bounce {
            0% {
                height: 4px;
            }

            100% {
                height: 100%;
            }
        }

        /* Rotação suave da capa quando tocando */
        .spin-slow {
            animation: spin 15s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- HEADER: VS Studio -->
    <header class="w-full bg-black/40 border-b border-white/10 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <img id="header-logo" src="Imagens/logo.png" alt="VS Studio" class="h-12 object-contain" onerror="this.style.display='none'">
                <div>
                    <h1 class="text-3xl text-yellow-500 leading-none fonte-titulo">VS STUDIO</h1>
                    <p class="text-[10px] sm:text-xs text-blue-400 tracking-widest font-bold uppercase">Rádio Web Produções</p>
                </div>
            </div>
            <a href="index.html" class="px-4 py-2 rounded-lg bg-white/5 hover:bg-white/10 border border-white/10 transition text-sm font-semibold flex items-center gap-2">
                <i class="fa-solid fa-house text-gray-400"></i> <span class="hidden sm:inline">Início</span>
            </a>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">

        <!-- O PLAYER CUSTOMIZADO -->
        <div class="glass-panel w-full max-w-4xl rounded-3xl p-6 sm:p-10 flex flex-col md:flex-row items-center gap-8 md:gap-12 relative overflow-hidden">

            <!-- Brilho de fundo decorativo -->
            <div class="absolute -top-20 -left-20 w-64 h-64 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <!-- COLUNA ESQUERDA: Capa do Álbum -->
            <div class="relative w-48 h-48 sm:w-64 sm:h-64 flex-shrink-0">
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-blue-600 to-yellow-500 animate-pulse blur-md opacity-30"></div>
                <!-- Capa da Música -->
                <img id="cover-art" src="Imagens/logo.png" alt="Capa da Música" class="relative w-full h-full object-cover rounded-full shadow-2xl border-4 border-gray-800 transition-transform duration-700 ease-in-out">

                <!-- Bolinha de "Ao Vivo" -->
                <div class="absolute top-2 right-2 bg-black/80 px-3 py-1 rounded-full border border-gray-700 flex items-center gap-2 z-10 backdrop-blur">
                    <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse"></div>
                    <span class="text-[10px] font-bold tracking-widest uppercase text-gray-300">Live</span>
                </div>
            </div>

            <!-- COLUNA DIREITA: Informações e Controles -->
            <div class="flex-1 w-full flex flex-col text-center md:text-left z-10">

                <!-- Status e Programa -->
                <div class="flex items-center justify-center md:justify-start gap-3 mb-2">
                    <span class="bg-blue-900/50 text-blue-400 text-[10px] font-bold px-2 py-1 rounded border border-blue-500/30 uppercase tracking-wider" id="program-name">
                        Carregando Programação...
                    </span>
                </div>

                <!-- Nome da Música -->
                <h2 id="song-title" class="text-3xl sm:text-4xl md:text-5xl font-black text-white leading-tight mb-1 truncate w-full" title="Conectando à rádio...">
                    Conectando...
                </h2>

                <!-- Nome do Artista -->
                <p id="artist-name" class="text-lg sm:text-xl text-gray-400 font-medium truncate w-full" title="Aguarde">
                    Sincronizando áudio
                </p>

                <!-- Visualizador de Barras CSS -->
                <div id="visualizer" class="bars-container justify-center md:justify-start mt-6 mb-8 opacity-50">
                    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
                </div>

                <!-- Controles do Player -->
                <div class="flex items-center justify-center md:justify-start gap-6 bg-black/30 p-4 rounded-2xl border border-white/5">

                    <!-- Botão Play/Pause Gigante -->
                    <button id="btn-play" class="w-16 h-16 rounded-full bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white flex items-center justify-center shadow-lg shadow-blue-900/50 transition-all transform hover:scale-105 active:scale-95">
                        <i id="play-icon" class="fa-solid fa-play text-2xl ml-1"></i>
                    </button>

                    <!-- Controle de Volume -->
                    <div class="flex items-center gap-3 bg-gray-900/50 px-4 py-2 rounded-full border border-gray-700/50 flex-1 max-w-[200px]">
                        <i class="fa-solid fa-volume-high text-gray-400 text-sm"></i>
                        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.8" class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                    </div>
                </div>

            </div>
        </div>

        <!-- Botão WhatsApp (Fixo abaixo do player) -->
        <div class="absolute bottom-28 md:bottom-32">
            <a href="https://wa.me/5554981092731?text=Olá,%20estou%20ligado%20na%20Rádio%20Voz%20da%20Segurança!" target="_blank" class="bg-[#25D366] hover:bg-[#1ebd5a] text-white px-6 py-2.5 rounded-full font-bold transition shadow-lg flex items-center gap-2 text-sm transform hover:-translate-y-1">
                <i class="fa-brands fa-whatsapp text-lg"></i> Falar com Estúdio
            </a>
        </div>

    </main>

    <footer class="w-full bg-black/60 border-t border-white/10 py-6">
        <div class="max-w-7xl mx-auto px-4 flex flex-col items-center">
            <h3 class="text-gray-500 text-[10px] tracking-widest font-bold mb-4 uppercase">Apoio Oficial</h3>

            <div class="flex flex-wrap justify-center items-center gap-6 sm:gap-10 opacity-60 hover:opacity-100 transition-opacity duration-300 grayscale hover:grayscale-0">
                <img src="Imagens/tradicao.png" alt="Tradição" class="h-6 sm:h-8 object-contain" onerror="this.style.display='none'">
                <img src="Imagens/IBCM 1.png" alt="IBCM" class="h-6 sm:h-8 object-contain" onerror="this.style.display='none'">
                <img src="Imagens/Nescafé 3A.png" alt="Nescafé 3A" class="h-6 sm:h-8 object-contain" onerror="this.style.display='none'">
                <img src="Imagens/ExtinBrassil.png" alt="ExtinBrassil" class="h-6 sm:h-8 object-contain" onerror="this.style.display='none'">
                <img src="Imagens/Pansera.png" alt="Pansera" class="h-6 sm:h-8 object-contain" onerror="this.style.display='none'">
            </div>
        </div>
    </footer>

    <script>
        // 1. Configurações base (URLs puras que você forneceu)
        const AUDIO_STREAM_URL = "https://servidor29-2.brlogic.com:7152/live?identifier=site%20voz%20da%20seguran%C3%A7a&source=3260";
        // URL da API extraída do iframe da BRLógica para puxar dados sem dar erro CORS!
        const API_METADATA_URL = "https://public-player-widget.webradiosite.com/app/player/info/254111?hash=b4fcc44382f351c76539595826c40aadf751d6c8";
        const DEFAULT_COVER = "Imagens/logo.png"; // Capa padrão (sua logo)

        // 2. Elementos da Tela
        const audio = new Audio();
        const btnPlay = document.getElementById("btn-play");
        const playIcon = document.getElementById("play-icon");
        const volumeSlider = document.getElementById("volume-slider");
        const coverArt = document.getElementById("cover-art");
        const songTitleEl = document.getElementById("song-title");
        const artistNameEl = document.getElementById("artist-name");
        const programNameEl = document.getElementById("program-name");
        const visualizer = document.getElementById("visualizer");

        let isPlaying = false;

        // 3. Funções de Controle de Áudio
        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                // "Descarrega" o stream para não consumir dados do ouvinte
                audio.src = "";
                playIcon.classList.remove("fa-pause");
                playIcon.classList.add("fa-play");
                coverArt.classList.remove("spin-slow");
                visualizer.classList.remove("playing");
            } else {
                // Recarrega a URL limpa para pegar o stream ao vivo atual
                audio.src = AUDIO_STREAM_URL;
                audio.volume = volumeSlider.value;
                audio.play().then(() => {
                    playIcon.classList.remove("fa-play");
                    playIcon.classList.add("fa-pause");
                    coverArt.classList.add("spin-slow");
                    visualizer.classList.add("playing");
                }).catch(e => {
                    console.error("Erro ao reproduzir:", e);
                    alert("Por favor, clique novamente para tocar.");
                });
            }
            isPlaying = !isPlaying;
        }

        btnPlay.addEventListener("click", togglePlay);

        volumeSlider.addEventListener("input", (e) => {
            audio.volume = e.target.value;
        });

        // 4. O Coração do Sistema: Sincronizador de Dados (BRLógica API)
        async function fetchRadioData() {
            try {
                // Faz a chamada na API da BRLógica silenciosamente
                const response = await fetch(API_METADATA_URL);
                const data = await response.json();

                // Extrai as informações. A BRLógica geralmente manda a música no campo 'current_track' ou 'track'
                // Aqui estamos sendo resilientes, procurando onde eles esconderam o dado no JSON
                let tituloCompleto = "Rádio Voz da Segurança";
                let nomePrograma = "Programação 24h";
                let urlCapa = DEFAULT_COVER;

                if (data && data.current_track) {
                    tituloCompleto = data.current_track.name || data.current_track.title || tituloCompleto;
                    urlCapa = data.current_track.cover || data.current_track.image || urlCapa;
                }
                if (data && data.program) {
                    nomePrograma = data.program.name || data.program.title || nomePrograma;
                }

                // Lógica para separar Cantor e Música (Geralmente vem como "Cantor - Música")
                let artista = "Voz da Segurança";
                let musica = tituloCompleto;

                if (tituloCompleto.includes(" - ")) {
                    const partes = tituloCompleto.split(" - ");
                    artista = partes[0].trim();
                    musica = partes.slice(1).join(" - ").trim();
                }

                // Evitar piscar a tela atoa, só atualiza se mudou de música
                if (songTitleEl.innerText !== musica) {
                    songTitleEl.innerText = musica;
                    songTitleEl.title = musica; // Tooltip para textos longos
                    artistNameEl.innerText = artista;
                    programNameEl.innerText = nomePrograma;

                    // Se a API não mandar capa, ou der erro, usamos a logo oficial
                    coverArt.src = urlCapa;
                    coverArt.onerror = () => { coverArt.src = DEFAULT_COVER; };

                    // Atualiza metadados do celular (Aparece na tela de bloqueio do celular!)
                    if ('mediaSession' in navigator) {
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: musica,
                            artist: artista,
                            album: 'Voz da Segurança Rádio Web',
                            artwork: [
                                { src: urlCapa, sizes: '512x512', type: 'image/jpeg' }
                            ]
                        });
                    }
                }

            } catch (error) {
                console.warn("Aguardando sincronização com a BRLógica...", error);
                // Em caso de instabilidade na internet, não fazemos nada e a música continua tocando.
            }
        }

        // Puxa os dados imediatamente ao carregar a página
        fetchRadioData();

        // E depois repete a cada 10 segundos para manter sempre sincronizado 100%
        setInterval(fetchRadioData, 10000);

    </script>
</body>
</html>
